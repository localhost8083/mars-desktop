# MarsBox: Mars's own WSL 2 distro (src/box/backends/wsl.js). It only hosts the
# per-project boxes; Windows stays out of it.
[boot]
systemd=false

[automount]
enabled=true
root=/mnt/
# Linux permissions on Windows folders (the project is bound into each box from /mnt/<drive>).
options="metadata"
mountFsTab=false

[interop]
# No Windows programs inside, and no Windows PATH: a bare `npm` must never be the Windows npm
# (the 2.2.x WSL failure, seen again in the 2026-10-11 bake-off).
enabled=false
appendWindowsPath=false

[network]
generateResolvConf=true
hostname=mars-box

[user]
default=root
