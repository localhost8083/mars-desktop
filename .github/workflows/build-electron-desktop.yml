name: Build Electron Desktop

on:
  workflow_dispatch:
    inputs:
      updater_e2e_only:
        description: "Run only the Windows in-app updater end-to-end jobs"
        type: boolean
        default: false
      next_version:
        description: "Version the updater end-to-end build is stamped with (above every published release)"
        type: string
        default: "3.4.3"
  push:
    branches:
      - electron-notary-test
    paths:
      - apps/app/**
      - apps/desktop/**
      - packages/ui/**
      - constants.json
      - pnpm-lock.yaml
      - package.json
      - .github/workflows/build-electron-desktop.yml

permissions:
  contents: read

jobs:
  build-electron:
    if: ${{ !inputs.updater_e2e_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: windows-11-arm
            artifact: windows-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be installed BEFORE setup-node so setup-node can find the
      # pnpm binary on PATH. Matches the pattern in build-desktop.yml so
      # the two workflows share the same bootstrap story.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Bun >= 1.3.10 is required by the server build and package-time helpers.
          bun-version: 1.3.10

      - name: Set up Go (sandbox helpers)
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/box/go/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Electron desktop (unpacked)
        env:
          MARS_DESKTOP_SENTRY_DSN: ${{ secrets.MARS_DESKTOP_SENTRY_DSN || vars.MARS_DESKTOP_SENTRY_DSN }}
          MARS_DESKTOP_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.MARS_DESKTOP_SENTRY_TRACES_SAMPLE_RATE || '0.01' }}
        run: pnpm --filter @mars/desktop package:electron:dir

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mars-electron-${{ matrix.artifact }}
          path: apps/desktop/dist-electron/**

  windows-update-check:
    if: ${{ !inputs.updater_e2e_only }}
    name: Windows update in place
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Set up Go (sandbox helpers)
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/box/go/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A version above the latest release, as a real update would carry.
      - name: Build the Windows installer
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @mars/desktop run build:electron
          pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --win nsis --x64 --publish never -c.extraMetadata.version=99.0.0

      - name: Update the latest release in place
        shell: pwsh
        run: scripts/release/check-windows-update.ps1 -NewInstaller (Get-ChildItem apps/desktop/dist-electron/*.exe | Select-Object -First 1).FullName

  # Published Windows releases update themselves with their own updater:
  # each installs, opens with a DevTools port and goes through the same
  # check, download and restart the required-update screen uses.
  windows-updater-next:
    name: Windows updater e2e build ${{ inputs.next_version }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Set up Go (sandbox helpers)
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/box/go/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Built like Desktop Release builds it: stamped version, NSIS, manifest verified.
      - name: Build the next release installer
        shell: bash
        env:
          NEXT_VERSION: ${{ inputs.next_version }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          node scripts/release/stamp-version.mjs --version "$NEXT_VERSION"
          pnpm --filter @mars/desktop build:electron
          pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --win --x64 --publish never
          node apps/desktop/scripts/verify-update-manifest.mjs --manifest apps/desktop/dist-electron/latest.yml --version "$NEXT_VERSION"

      - name: Upload the feed
        uses: actions/upload-artifact@v4
        with:
          name: updater-e2e-feed
          path: |
            apps/desktop/dist-electron/latest.yml
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.exe.blockmap

  windows-updater-e2e:
    name: Windows updater e2e ${{ matrix.from }} -> ${{ matrix.label }}
    if: github.event_name == 'workflow_dispatch'
    needs: windows-updater-next
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { from: "3.3.7", label: next, feed: local }
          - { from: "3.3.8", label: next, feed: local }
          - { from: "3.4.0", label: next, feed: local }
          - { from: "3.4.1", label: next, feed: local }
          - { from: "3.4.2", label: next, feed: local }
          # The public feed as it is now (whatever release is marked Latest).
          - { from: "3.3.8", label: public-latest, feed: public }
          # The dead end: 3.3.8's own manifest as the feed.
          - { from: "3.3.8", label: same-version, feed: same }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/release

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download the feed
        if: matrix.feed == 'local'
        uses: actions/download-artifact@v4
        with:
          name: updater-e2e-feed
          path: feed

      - name: Run the installed release's updater
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ matrix.from }}
          FEED: ${{ matrix.feed }}
          NEXT_VERSION: ${{ inputs.next_version }}
        run: |
          set -euo pipefail
          case "$FEED" in
            local) node scripts/release/windows-updater-e2e.mjs --from "$FROM" --expect "$NEXT_VERSION" --feed feed ;;
            public)
              latest="$(gh api repos/mars-ai/mars-gui/releases/latest --jq .tag_name)"
              node scripts/release/windows-updater-e2e.mjs --from "$FROM" --expect "${latest#v}" ;;
            same)
              mkdir -p same
              gh release download "v$FROM" --repo mars-ai/mars-gui --pattern latest.yml --dir same
              node scripts/release/windows-updater-e2e.mjs --from "$FROM" --expect none --feed same ;;
          esac

      - name: Collect app logs
        if: always()
        shell: bash
        run: |
          mkdir -p updater-e2e/app-logs
          cp -r "$APPDATA/ai.marsai.desktop/logs/." updater-e2e/app-logs/ 2>/dev/null || true
          rm -f updater-e2e/*.exe

      - name: Upload app logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updater-e2e-logs-${{ matrix.from }}-${{ matrix.label }}
          path: updater-e2e/
          if-no-files-found: ignore

  electron-macos-notarization-smoke:
    if: ${{ !inputs.updater_e2e_only }}
    name: Electron macOS notarization smoke
    runs-on: macos-14
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Set up Go (sandbox helpers)
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/box/go/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same signing, notarization and checks as the release workflow's mac leg.
      - name: Prepare macOS signing
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: scripts/release/macos-signing-env.sh

      - name: Package Electron desktop (signed + notarized, no publish)
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          MARS_DESKTOP_SENTRY_DSN: ${{ secrets.MARS_DESKTOP_SENTRY_DSN || vars.MARS_DESKTOP_SENTRY_DSN }}
          MARS_DESKTOP_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.MARS_DESKTOP_SENTRY_TRACES_SAMPLE_RATE || '0.01' }}
        run: |
          set -euo pipefail
          pnpm --filter @mars/desktop run build:electron
          pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --mac --arm64 -c.mac.forceCodeSigning=true --publish never

      - name: Notarize macOS disk image
        run: |
          node apps/desktop/scripts/macos-notarize.cjs \
            --dist apps/desktop/dist-electron \
            --manifest apps/desktop/dist-electron/latest-mac.yml \
            --keychain "$MACOS_SIGNING_KEYCHAIN"

      - name: Verify update manifest
        run: node apps/desktop/scripts/verify-update-manifest.mjs --manifest apps/desktop/dist-electron/latest-mac.yml

      - name: Verify macOS signature and notarization
        run: scripts/release/verify-macos-signing.sh apps/desktop/dist-electron

      - name: Verify the bundled engine is signed and runs
        run: |
          set -euo pipefail
          app=$(find apps/desktop/dist-electron -maxdepth 2 -name '*.app' -type d | head -n 1)
          engine="$app/Contents/Resources/sidecars/opencode-aarch64-apple-darwin"
          codesign --verify --strict --verbose=2 "$engine"
          codesign -dv --verbose=4 "$engine" 2>&1 | grep -E '^(Authority|TeamIdentifier|Runtime|Identifier)'
          codesign -dv --verbose=4 "$engine" 2>&1 | grep -q '^Authority=Developer ID Application' || { echo "the bundled engine is not Developer ID signed" >&2; exit 1; }
          version=$("$engine" --version)
          echo "bundled engine: $version"
          test "$version" = "$(node -p "require('./apps/desktop/scripts/engine-release.json').version")"

      - name: Check installer window, app name and in-place update
        run: scripts/release/check-macos-installer.sh apps/desktop/dist-electron "$RUNNER_TEMP/installer-check"

      - name: Upload installer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mars-macos-installer-window
          path: ${{ runner.temp }}/installer-check
          if-no-files-found: ignore

      - name: Upload signed macOS build
        uses: actions/upload-artifact@v4
        with:
          name: mars-electron-macos-signed
          path: |
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.zip
            apps/desktop/dist-electron/*.blockmap
            apps/desktop/dist-electron/latest-mac.yml
