name: Linux Packages

# Builds the Linux installers the release publishes (x64 and arm64: .deb,
# .AppImage, .tar.gz, .pacman) with the release's steps, without publishing,
# then installs and launches them: each .deb on Ubuntu, each .pacman and the
# AUR PKGBUILD (built from this run's tarball) on Arch Linux of the same CPU.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/desktop/electron-builder*.yml
      - apps/desktop/scripts/prepare-sidecar.mjs
      - apps/desktop/scripts/engine-release.json
      - packaging/aur/**
      - scripts/aur/**
      - .github/workflows/release-desktop.yml
      - .github/workflows/linux-packages.yml

permissions:
  contents: read

concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and launch (${{ matrix.name }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            builder_args: --linux --x64
            update_manifest: latest-linux.yml
            deb_arch: amd64
            file_arch: x86-64
          - name: arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            builder_args: --linux --arm64
            update_manifest: latest-linux-arm64.yml
            deb_arch: arm64
            file_arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      # A plain X.Y.Z: pacman versions cannot contain "-".
      PACKAGE_VERSION: 0.0.${{ github.run_number }}
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools rpm xvfb file

      - name: Install dependencies
        run: pnpm --filter @mars/desktop... --filter @mars/app... --filter mars-server... --filter mars-ui-mcp... install --frozen-lockfile --prefer-offline

      - name: Stamp version
        run: node scripts/release/stamp-version.mjs --version "$PACKAGE_VERSION"

      - name: Build desktop application
        env:
          TARGET: ${{ matrix.target }}
        run: pnpm --filter @mars/desktop build:electron

      - name: Package installers
        run: |
          pnpm --dir apps/desktop exec electron-builder \
            --config electron-builder.yml \
            ${{ matrix.builder_args }} \
            --publish never
          ls -la apps/desktop/dist-electron

      - name: Verify packaged server imports
        run: node apps/desktop/scripts/verify-packaged-imports.mjs

      - name: Verify update manifest
        run: |
          node apps/desktop/scripts/verify-update-manifest.mjs \
            --manifest "apps/desktop/dist-electron/${{ matrix.update_manifest }}" \
            --version "$PACKAGE_VERSION"

      - name: Check every installer was produced
        working-directory: apps/desktop/dist-electron
        run: |
          set -euo pipefail
          for f in mars-linux-*-"$PACKAGE_VERSION".{deb,AppImage,tar.gz,pacman}; do
            [ -f "$f" ] || { echo "missing $f" >&2; exit 1; }
            echo "$f $(du -h "$f" | cut -f1)"
          done
          [ -f "mars-linux-${{ matrix.deb_arch }}-$PACKAGE_VERSION.deb" ]

      - name: Install the .deb and launch it
        run: |
          set -euo pipefail
          sudo apt-get install --yes "./apps/desktop/dist-electron/mars-linux-${{ matrix.deb_arch }}-$PACKAGE_VERSION.deb"
          echo "launcher -> $(readlink -f /usr/bin/mars)"
          file -L /usr/bin/mars | tee /dev/stderr | grep -q "${{ matrix.file_arch }}"
          install_dir=$(dirname "$(readlink -f /usr/bin/mars)")
          target_sidecar="$install_dir/resources/sidecars/opencode-${{ matrix.target }}"
          file -L "$target_sidecar" | tee /dev/stderr | grep -q "${{ matrix.file_arch }}"
          test ! -e "$install_dir/resources/sidecars/opencode"
          # Still running when the timer fires (exit 124) = it started.
          set +e
          xvfb-run -a timeout 25 mars --no-sandbox > launch.log 2>&1
          rc=$?
          set -e
          tail -20 launch.log
          [ "$rc" -eq 124 ] || { echo "mars exited with $rc before the timeout" >&2; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: mars-linux-${{ matrix.name }}
          path: |
            apps/desktop/dist-electron/mars-linux-*.tar.gz
            apps/desktop/dist-electron/mars-linux-*.pacman
            apps/desktop/dist-electron/mars-linux-*.deb
            apps/desktop/dist-electron/mars-linux-*.AppImage
            apps/desktop/dist-electron/latest-linux*.yml
          retention-days: 7

  arch:
    name: Arch Linux (${{ matrix.carch }})
    needs: build
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - carch: x86_64
            artifact: mars-linux-x64
            tar_arch: x64
            runner: ubuntu-22.04
            image: docker.io/library/archlinux:base-devel
          # The official image is x86_64 only; Arch Linux ARM, rebuilt daily.
          - carch: aarch64
            artifact: mars-linux-arm64
            tar_arch: arm64
            runner: ubuntu-22.04-arm
            image: docker.io/menci/archlinuxarm:base-devel
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
      PACKAGE_VERSION: 0.0.${{ github.run_number }}
    steps:
      - name: Install test tools
        run: |
          # pacman 7 confines its downloads with Landlock, which the runner's
          # container runtime does not permit ("restricting filesystem access
          # failed"). The official archlinux image already sets
          # DisableSandboxFilesystem; do the same on Arch Linux ARM.
          sed -i 's/^#[[:space:]]*DisableSandboxFilesystem/DisableSandboxFilesystem/' /etc/pacman.conf
          grep -q '^DisableSandboxFilesystem' /etc/pacman.conf \
            || sed -i '0,/^\[options\]/s//[options]\nDisableSandboxFilesystem/' /etc/pacman.conf
          # Arch Linux ARM mirrors stall now and then; wait instead of
          # aborting after 10 s under 1 B/s, and retry the whole install.
          grep -q '^DisableDownloadTimeout' /etc/pacman.conf \
            || sed -i '0,/^\[options\]/s//[options]\nDisableDownloadTimeout/' /etc/pacman.conf
          grep -nE '^(DownloadUser|DisableSandbox|DisableDownloadTimeout)' /etc/pacman.conf
          for attempt in 1 2 3; do
            pacman -Syu --noconfirm --needed git xorg-server-xvfb file desktop-file-utils namcap && break
            [ "$attempt" -lt 3 ] || exit 1
            echo "pacman failed (attempt $attempt); retrying" >&2
            sleep 10
          done

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Install the .pacman and launch it
        run: |
          set -euo pipefail
          pkg=$(ls dist/mars-linux-*-"$PACKAGE_VERSION".pacman)
          bsdtar -xOf "$pkg" .PKGINFO | grep -E "^(pkgname|pkgver|arch|depend) "
          bsdtar -xOf "$pkg" .PKGINFO | grep -q "^arch = ${{ matrix.carch }}$"
          for attempt in 1 2 3; do
            pacman -U --noconfirm "$pkg" && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 10
          done
          echo "launcher -> $(readlink -f /usr/bin/mars)"
          file -L /usr/bin/mars
          set +e
          xvfb-run -a timeout 25 mars --no-sandbox > launch.log 2>&1
          rc=$?
          set -e
          tail -20 launch.log
          [ "$rc" -eq 124 ] || { echo "mars exited with $rc before the timeout" >&2; exit 1; }
          pacman -Rns --noconfirm mars

      - name: Build the AUR PKGBUILD from this run's tarball, install and launch it
        run: |
          set -euo pipefail
          useradd -m builder
          mkdir /build
          cp packaging/aur/PKGBUILD /build/
          # makepkg uses a source already in the build directory under its
          # name instead of downloading it.
          cp "dist/mars-linux-${{ matrix.tar_arch }}-$PACKAGE_VERSION.tar.gz" \
            "/build/mars-$PACKAGE_VERSION-${{ matrix.tar_arch }}.tar.gz"
          cp LICENSE "/build/mars-$PACKAGE_VERSION-LICENSE"
          chown -R builder /build
          cd /build
          sha=$(sha256sum "mars-$PACKAGE_VERSION-${{ matrix.tar_arch }}.tar.gz" | cut -d' ' -f1)
          sed -i -e "s/^pkgver=.*/pkgver=$PACKAGE_VERSION/" \
            -e "s/^sha256sums_${{ matrix.carch }}=.*/sha256sums_${{ matrix.carch }}=('$sha')/" PKGBUILD
          # Binary repack: the runtime depends are installed by pacman -U.
          sudo -u builder makepkg -f -d --noconfirm
          # .zst on Arch, .xz on Arch Linux ARM (makepkg.conf PKGEXT).
          pkg=
          for f in mars-"$PACKAGE_VERSION"-1-${{ matrix.carch }}.pkg.tar.*; do
            case "$f" in *.sig) ;; *) pkg=$f ;; esac
          done
          [ -f "$pkg" ]
          namcap "$pkg" || true
          for attempt in 1 2 3; do
            pacman -U --noconfirm "$pkg" && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 10
          done
          echo "launcher -> $(readlink -f /usr/bin/mars)"
          file -L /usr/bin/mars | grep -q "$( [ "${{ matrix.carch }}" = x86_64 ] && echo x86-64 || echo aarch64 )"
          ls /usr/share/icons/hicolor/*/apps/mars.*
          desktop-file-validate /usr/share/applications/mars.desktop
          test -s /usr/share/licenses/mars/LICENSE
          set +e
          xvfb-run -a timeout 25 mars --no-sandbox > launch.log 2>&1
          rc=$?
          set -e
          tail -20 launch.log
          [ "$rc" -eq 124 ] || { echo "mars exited with $rc before the timeout" >&2; exit 1; }
